[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "corpusrag"
version = "0.5.0"
description = "Unified learning and knowledge management toolkit with RAG, flashcards, and video transcription"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "chromadb>=1.0.20",
  "sentence-transformers>=3.0.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2",
  "pypdf>=5.1.0",
  "click>=8.1.0",
  "ollama>=0.4.0",
  "mcp[cli]>=1.20.0",
  # LangChain dependencies for RAG pipeline
  "langchain>=0.3.0",
  "langchain-community>=0.3.0",
  "langchain-chroma>=0.2.0",
  # Security dependencies
  "keyring>=25.0.0",
  "cryptography>=41.0.0",
  "rank_bm25>=0.2.2",
  "rich>=13.7.0",
  "textual>=0.50.0",
  "transformers>=4.38.0",
  "huggingface-hub>=0.20.0",
  "langchain-core>=0.3.0",
  "langchain-text-splitters>=0.3.0",
  "torch>=2.11.0",
  "torchvision>=0.26.0",
  "torchaudio>=2.11.0",
  "faster-whisper>=1.2.1",
]

[project.optional-dependencies]
# Generators (flashcards, summaries, quizzes)
generators = [
  "tiktoken>=0.5.0",
]

# Server-only footprint. NOTE: this is NOT torch-free. Because sentence-transformers
# requires torch, this group still pulls in torch, faster-whisper, and transformers.
server = [
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "chromadb>=1.0.20",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2",
  "pypdf>=5.1.0",
  "click>=8.1.0",
  "ollama>=0.4.0",
  "mcp[cli]>=1.20.0",
  "langchain>=0.3.0",
  "langchain-community>=0.3.0",
  "langchain-chroma>=0.2.0",
  "keyring>=25.0.0",
  "cryptography>=41.0.0",
  "rank_bm25>=0.2.2",
  "rich>=13.7.0",
  "langchain-core>=0.3.0",
  "langchain-text-splitters>=0.3.0",
  "huggingface-hub>=0.20.0",
]

# Video transcription
video = [
  "faster-whisper>=1.0.0",
  "Pillow>=10.0.0",
  "numpy>=1.24.0",
]

# Handwriting ingestion
handwriting = [
  "ollama>=0.1.0",
  "Pillow>=10.0.0",
  "numpy>=1.24.0",
]

# Full installation (all features)
full = [
  "corpusrag[generators]",
  "corpusrag[video]",
  "corpusrag[observability]",
  "corpusrag[export]",
]

# Development tools
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
  "hypothesis>=6.100.0",
  "ruff>=0.4.0",
  "deptry>=0.20.0",
]

# Observability (telemetry, tracing)
observability = [
  "opentelemetry-api>=1.20.0",
  "opentelemetry-sdk>=1.20.0",
  "opentelemetry-exporter-otlp>=1.20.0",
  "opentelemetry-instrumentation-fastapi>=0.41b0",
  "opentelemetry-instrumentation-httpx>=0.41b0",
  "traceloop-sdk>=0.3.0",
]

# Export support (Anki, etc.)
export = [
  "genanki>=0.13.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli", "cli_common", "cli_dev", "setup_wizard"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
# Unified CLI (cross-platform entry point)
corpus = "cli:main"

# MCP Server
corpus-mcp-server = "mcp_server.server:main"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors (syntax and whitespace)
  "W",      # pycodestyle warnings
  "F",      # Pyflakes (undefined names, duplicate imports)
  "I",      # isort (import sorting)
]
ignore = [
  "E501",   # line too long (handled by Black formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/test_smoke.py" = ["E402"]  # imports after sys.path manipulation
"src/tools/rag/retriever.py" = ["E402"]
# Intentional: these strategies suppress transformers/HF import-time logging
# by calling disable_progress_bars()/set_verbosity_error() before importing
# sentence_transformers, so those imports deliberately follow runtime calls.
"src/tools/rag/strategies/hybrid.py" = ["E402"]
"src/tools/rag/strategies/semantic.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["config", "db", "llm", "mcp_server", "orchestrations", "tools", "utils"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# Align the test import model with the package architecture: put src/ on the
# import path and use importlib import mode so modules are imported under a
# single canonical name (e.g. `tools.flashcards`). This avoids pytest's
# prepend-mode inserting test directories onto sys.path, which previously
# caused dual-package collisions (`tools` vs `src.tools`) during collection.
pythonpath = ["src"]
markers = ["live: tests requiring running ChromaDB and Ollama"]
addopts = "-v --tb=short -m 'not live' --import-mode=importlib"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.deptry]
package_module_name_map = { "huggingface-hub" = "huggingface_hub", "faster-whisper" = "faster_whisper" }
# Tell deptry these are local modules, not external libraries
known_first_party = [
  "db", 
  "tools", 
  "utils", 
  "config", 
  "orchestrations", 
  "cli_common", 
  "cli_dev", 
  "setup_wizard", 
  "llm"
]

[tool.deptry.per_rule_ignores]
# DEP002 'defined but not used in src': CLI/infra tools, dev/test tooling, and
# ML backends that are used transitively (torch via sentence-transformers /
# faster-whisper) or only at runtime rather than imported directly in src.
DEP002 = [
  "uvicorn", "python-dotenv", "ollama", "langchain",
  "opentelemetry-api", "opentelemetry-sdk", "opentelemetry-exporter-otlp",
  "opentelemetry-instrumentation-fastapi", "opentelemetry-instrumentation-httpx",
  "traceloop-sdk",
  "langchain-community", "langchain-chroma",
  "torch", "torchvision", "torchaudio",
  "pytest", "pytest-cov", "hypothesis", "ruff", "deptry",
]
# DEP003 'transitive': starlette is provided by fastapi and imported directly
# in the MCP middleware; it is guaranteed present wherever fastapi is installed.
DEP003 = ["starlette"]
# DEP001 'missing': pix2tex is an optional LaTeX-OCR backend imported lazily
# inside a function; it is not a required dependency of the core package.
DEP001 = ["pix2tex"]

[tool.uv]
python-preference = "managed"

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
